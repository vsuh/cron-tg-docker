# .github/workflows/build-and-push.yml
name: Build and push Docker image on new reminder-tgm tag

on:
  repository_dispatch:
    types: [new-reminder-tgm-tag]
  workflow_dispatch:

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: write  # для push изменений в репо
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: true  # ← важно для последующего git push

      # 🔹 Опционально: проверить, что архив с исходниками существует
      - name: Check if release archive exists
        run: |
          curl -f -I "https://github.com/vsuh/reminder-tgm/archive/refs/tags/${{ github.event.client_payload.tag }}.tar.gz"

      # 🔹 Обновляем TAG в Dockerfile и коммитим (для истории)
      - name: Update TAG in Dockerfile
        env:
          PAT_TOKEN: ${{ secrets.PAT_TOKEN }}
        run: |
          # Обновляем переменную TAG
          sed -i '/^[[:space:]]*TAG=/s/TAG="[^"]*"/TAG="${{ github.event.client_payload.tag }}"/' Dockerfile
          
          # Коммитим изменения (опционально, для истории версий)
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Dockerfile
          if ! git diff --cached --quiet; then
            git commit -m "chore: update TAG to ${{ github.event.client_payload.tag }}"
            git remote set-url origin https://x-access-token:${PAT_TOKEN}@github.com/${{ github.repository }}
            git push origin HEAD:${GITHUB_REF##*/}
          else
            echo "No changes to commit"
          fi

      # 🔹 Настройка Docker Buildx
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # 🔹 Логин в Docker Hub
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # 🔹 Сборка и пуш образа
      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            docker.io/vsuh/cron-tg:${{ github.event.client_payload.tag }}
            docker.io/vsuh/cron-tg:latest
            # Опционально: minor-версия (1.4 из 1.4.3)
            # ${{ github.event.client_payload.tag =~ /^v?([0-9]+\.[0-9]+)\.[0-9]+$/ && format('docker.io/vsuh/cron-tg:{0}', matches[0]) }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          platforms: linux/amd64,linux/arm64  # ← мульти-архитектура

      # 🔹 Верификация (опционально)
      - name: Verify pushed images
        run: |
          echo "✅ Successfully built and pushed:"
          echo "  - docker.io/vsuh/cron-tg:${{ github.event.client_payload.tag }}"
          echo "  - docker.io/vsuh/cron-tg:latest"
          # Проверка через API Docker Hub
          curl -s "https://hub.docker.com/v2/repositories/vsuh/cron-tg/tags/" | grep -q "${{ github.event.client_payload.tag }}" && echo "✅ Tag visible on Docker Hub"

      # 🔹 Уведомление в Telegram
      - name: Send Telegram notification
        uses: appleboy/telegram-action@master
        with:
          to: ${{ secrets.TELEGRAM_CHAT_ID }}
          token: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          message: |
            ✅ Build & Push successful!

            📦 Image: docker.io/vsuh/cron-tg
            🏷 Tags: ${{ github.event.client_payload.tag }}, latest
            🔗 Repo: ${{ github.repository }}
            🎯 Source tag: ${{ github.event.client_payload.tag }}
            📝 Commit message:
            ${{ github.event.client_payload.message }}
